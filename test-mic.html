<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STT Debug Tool</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https:; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline'; connect-src 'self' https://*.google.com https://*.googleapis.com; worker-src 'self' blob:;">
    <style>
        body { font-family: sans-serif; padding: 40px; background: #1a1a1a; color: white; text-align: center; }
        #status { font-weight: bold; margin: 20px; padding: 10px; border-radius: 5px; background: #333; }
        .listening { background: #15803d !important; color: white; }
        .error { background: #991b1b !important; }
        button { padding: 15px 30px; font-size: 18px; cursor: pointer; border-radius: 8px; border: none; background: #4f46e5; color: white; }
        #log { text-align: left; background: #000; padding: 15px; margin-top: 20px; font-family: monospace; height: 300px; overflow-y: auto; border: 1px solid #444; }
        .log-entry { margin-bottom: 5px; border-bottom: 1px solid #222; padding-bottom: 2px; }
        .log-err { color: #f87171; }
        .log-success { color: #4ade80; }
    </style>
</head>
<body>

    <h1>STT Connectivity Test</h1>
    <p>Check console (F12) and the box below.</p>
    
    <div id="status">IDLE</div>
    <button id="start-btn">TAP TO TEST MICROPHONE</button>
    
    <div id="log"></div>

    <script>
        const btn = document.getElementById('start-btn');
        const statusDiv = document.getElementById('status');
        const logDiv = document.getElementById('log');

        function log(msg, type = '') {
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logDiv.prepend(entry);
            console.log(`STT_LOG: ${msg}`);
        }

        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRec) {
            log("CRITICAL: Web Speech API not supported in this browser.", "log-err");
            statusDiv.textContent = "NOT SUPPORTED";
        } else {
            const rec = new SpeechRec();
            rec.continuous = false;
            rec.lang = 'en-US';

            rec.onstart = () => {
                statusDiv.textContent = "LISTENING...";
                statusDiv.className = "listening";
                log("Mic session started successfully. Capturing hardware...", "log-success");
            };

            rec.onresult = (e) => {
                const text = e.results[0][0].transcript;
                log(`RESULT RECEIVED: "${text}"`, "log-success");
                statusDiv.textContent = "SUCCESS!";
            };

            rec.onerror = (e) => {
                statusDiv.textContent = `ERROR: ${e.error}`;
                statusDiv.className = "error";
                log(`SPEECH ERROR: ${e.error}`, "log-err");
                
                if (e.error === 'network') {
                    log("ADVICE: Connection severed. Check Cloudflare WAF or browser CSP.", "log-err");
                }
            };

            rec.onend = () => {
                if (statusDiv.textContent !== "SUCCESS!") {
                    statusDiv.textContent = "ENDED (No Result)";
                    statusDiv.className = "";
                }
                log("Session ended.");
            };

            btn.onclick = () => {
                log("Button clicked. Initializing...");
                try {
                    rec.start();
                } catch (err) {
                    log(`START FAILED: ${err.message}`, "log-err");
                }
            };
        }
    </script>
</body>
</html>
