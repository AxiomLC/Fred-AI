<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https:; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https:; connect-src 'self' https://n8n.airpg.ai https://api.x.ai https://*.google.com https://*.googleapis.com; worker-src 'self' blob:;">
  <title>W57th · Fred AI Voice</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    #text-input-wrap { display: none; width: 100%; max-width: 400px; margin: 0 auto 15px auto; }
    #text-input-wrap.active { display: flex; gap: 10px; }
    #text-input-field { flex: 1; padding: 12px 20px; border-radius: 25px; border: 1px solid rgba(167, 139, 250, 0.3); background: rgba(0, 0, 0, 0.5); color: #fff; font-family: 'Playfair Display', serif; outline: none; }
    #keyboard-toggle { cursor: pointer; font-size: 18px; margin-left: 10px; opacity: 0.7; }
    
    /* Mic Green Glow Styling */
    body.listening #mic-btn {
      background: rgba(34, 197, 94, 0.2) !important;
      border: 2px solid #22c55e !important;
      box-shadow: 0 0 20px rgba(34, 197, 94, 0.6);
    }
    body.listening #icon-mic { stroke: #22c55e !important; }
  </style>
</head>
<body>

  <div id="bg"></div>
  <div id="bg-vignette"></div>

  <div id="app">
    <div id="logo-wrap">
      <img src="https://media.airpg.ai/icon2-circle.png" alt="W57th logo" />
      <div id="brand-line"><span id="brand-w57">W57TH</span><span id="brand-fred">· Fred AI</span></div>
      <div id="tagline">Voice Intelligence · New York</div>
    </div>

    <div id="transcript-wrap">
      <div id="transcript-header"><span class="dot"></span> LIVE CONVERSATION</div>
      <div id="transcript-scroll">
        <div class="msg ai"><span class="msg-label">FRED AI</span><span class="msg-text">Yeah? What's on your mind?</span></div>
        <div id="typing"><span></span><span></span><span></span></div>
      </div>
    </div>

    <div id="controls">
      <div id="text-input-wrap"><input type="text" id="text-input-field" placeholder="Type a message..." autocomplete="off" /></div>
      <div id="waveform"></div>
      <button id="mic-btn">
        <svg id="icon-mic" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="var(--blue-glow)" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
        <svg id="icon-speaker" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#a78bfa" stroke-width="2" style="display:none"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
      </button>
      <div id="status-text-row" style="display: flex; align-items: center; justify-content: center;">
        <span id="status-text">TAP TO SPEAK</span>
        <span id="keyboard-toggle">⌨️</span>
      </div>
    </div>
    <div id="footer">W57TH · FRED AI · POWERED BY AIRPG.AI</div>
  </div>

  <script>
    const DEV = {
      N8N_URL: "https://n8n.airpg.ai/webhook/fred",
      GROK_URL: "https://api.x.ai/v1/tts",
      GROK_KEY: "xai-5aDdDimj7pOBE6TxvGng1W4REEOlezq6ZHhHVdy9lunH7uWKsjIzA9mQimctnv9d1ItfI2j3YPCEh4cB",
      VOICE_ID: "96819d0bd28d",
      TAGS: "<soft><lower-pitch><fast>{{TEXT}}</fast></lower-pitch></soft>"
    };

    const USER_PHONE = new URLSearchParams(window.location.search).get('phone') || localStorage.getItem('w57_phone') || "";
    const SESSION_ID = USER_PHONE || ('sess_' + Math.random().toString(36).slice(2, 9));

    const micBtn = document.getElementById('mic-btn'),
          statusTxt = document.getElementById('status-text'),
          scroll = document.getElementById('transcript-scroll'),
          typing = document.getElementById('typing'),
          iconMic = document.getElementById('icon-mic'),
          iconSpk = document.getElementById('icon-speaker'),
          kbdToggle = document.getElementById('keyboard-toggle'),
          kbdWrap = document.getElementById('text-input-wrap'),
          kbdInput = document.getElementById('text-input-field');

    let isListening = false, currentAudio = null;

    function setState(s) {
      document.body.className = s;
      if (s === 'listening') { statusTxt.textContent = 'LISTENING...'; iconMic.style.display = 'block'; iconSpk.style.display = 'none'; }
      else if (s === 'speaking') { statusTxt.textContent = 'FRED IS SPEAKING'; iconMic.style.display = 'none'; iconSpk.style.display = 'block'; }
      else if (s === 'thinking') { statusTxt.textContent = 'FRED IS THINKING...'; }
      else { statusTxt.textContent = 'TAP TO SPEAK'; iconMic.style.display = 'block'; iconSpk.style.display = 'none'; }
    }

    function addMsg(role, text, isError = false) {
      typing.classList.remove('active');
      const m = document.createElement('div');
      m.className = `msg ${role} ${isError ? 'system-error' : ''}`;
      m.innerHTML = `<span class="msg-label">${role==='user'?'YOU':'FRED AI'}</span><span class="msg-text">${text}</span>`;
      scroll.insertBefore(m, typing);
      scroll.scrollTop = scroll.scrollHeight;
    }

    /* --- STT Implementation: The "2026 Bulletproof" Logic --- */
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    let rec = null;
    
    if (SpeechRec) {
      rec = new SpeechRec();
      rec.continuous = false; 
      rec.interimResults = false;
      rec.lang = 'en-US';

      rec.onstart = () => { isListening = true; setState('listening'); };
      rec.onresult = (e) => { processInput(e.results[0][0].transcript); };
      rec.onerror = (e) => {
        console.error("DEBUG STT ERROR:", e.error);
        isListening = false;
        setState('');
      };
      rec.onend = () => { 
        isListening = false; 
        if (document.body.className === 'listening') setState(''); 
      };
    }

    async function processInput(text) {
      if (currentAudio) currentAudio.pause();
      addMsg('user', text);
      setState('thinking');
      typing.classList.add('active');
      try {
        const res = await fetch(DEV.N8N_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text, phone: USER_PHONE, sessionId: SESSION_ID })
        });
        const raw = await res.text();
        if (raw.includes("headers") || raw.includes("Internal Server Error")) throw new Error("n8n Error");
        const clean = raw.replace(/<[^>]*>/g, "").replace(/\[.*?\]/g, "");
        addMsg('ai', clean);
        await playFred(raw, clean);
      } catch (err) {
        addMsg('ai', `[Error: ${err.message}]`, true);
        setState('');
      }
    }

    async function playFred(tagged, fallback) {
      setState('speaking');
      try {
        const res = await fetch(DEV.GROK_URL, {
          method: "POST",
          headers: { "Authorization": `Bearer ${DEV.GROK_KEY}`, "Content-Type": "application/json" },
          body: JSON.stringify({ text: DEV.TAGS.replace("{{TEXT}}", tagged), voice_id: DEV.VOICE_ID, language: "en" }),
        });
        const blob = await res.blob();
        currentAudio = new Audio(URL.createObjectURL(blob));
        await currentAudio.play();
        currentAudio.onended = () => setState('');
      } catch (e) {
        const ut = new SpeechSynthesisUtterance(fallback);
        ut.onend = () => setState('');
        speechSynthesis.speak(ut);
      }
    }

    /* --- Click Event: Force Reset Logic --- */
    micBtn.onclick = () => {
      if (isListening) {
        rec.abort(); // Stronger than .stop()
        return;
      }
      if (currentAudio) currentAudio.pause();

      // Force a clean state by aborting anything "hanging"
      try { rec.abort(); } catch(e) {}
      
      // Wait for hardware to cycle
      setTimeout(() => {
        try {
          rec.start();
        } catch(e) {
          console.warn("Retrying start...");
          rec.abort();
          setTimeout(() => rec.start(), 300);
        }
      }, 250);
    };

    kbdToggle.onclick = () => { kbdWrap.classList.toggle('active'); if(kbdWrap.classList.contains('active')) kbdInput.focus(); };
    kbdInput.onkeydown = (e) => { if (e.key === 'Enter' && kbdInput.value.trim()) { processInput(kbdInput.value); kbdInput.value = ''; kbdWrap.classList.remove('active'); } };
  </script>
</body>
</html>
