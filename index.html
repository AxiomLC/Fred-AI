<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fred AI · Voice Intelligence</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="bg"></div>
  <div id="bg-vignette"></div>
  <div id="app">
    <div id="logo-wrap">
      <img src="https://media.airpg.ai/icon2-circle.png" alt="W57th" />
      <div id="brand-line"><span id="brand-fred">Fred AI</span></div>
      <div id="tagline">Voice Intelligence · New York</div>
    </div>

    <div id="transcript-wrap">
      <div id="transcript-header"><span class="dot"></span> LIVE CONVERSATION</div>
      <div id="transcript-scroll">
        <div id="typing"><span></span><span></span><span></span></div>
      </div>
    </div>

    <div id="controls">
      <div id="waveform"></div>
      <button id="mic-btn">
        <svg id="icon-mic" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="var(--blue-glow)" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
      </button>
      <div id="status-text-row">
        <span id="status-text">MIC OFF</span>
      </div>
    </div>
  </div>

  <script>
    const DEV = {
      N8N_URL: "https://n8n.airpg.ai/webhook/fred",
      GROK_URL: "https://api.x.ai/v1/tts",
      GROK_KEY: "xai-5aDdDimj7pOBE6TxvGng1W4REEOlezq6ZHhHVdy9lunH7uWKsjIzA9mQimctnv9d1ItfI2j3YPCEh4cB",
      VOICE_ID: "96819d0bd28d"
    };

    const micBtn = document.getElementById('mic-btn'),
          statusTxt = document.getElementById('status-text'),
          scroll = document.getElementById('transcript-scroll'),
          typing = document.getElementById('typing');

    let isListening = false, currentAudio = null;

    // 1. STT Setup
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    const rec = new SpeechRec();
    rec.continuous = true; // STAYS ON until manual toggle
    rec.interimResults = false;

    rec.onstart = () => { isListening = true; document.body.className = 'listening'; statusTxt.textContent = 'MIC LIVE'; };
    rec.onend = () => { if(isListening) rec.start(); }; // Restart if it times out naturally
    rec.onresult = (e) => {
        const text = e.results[e.results.length - 1][0].transcript;
        processInput(text);
    };

    // 2. Logic Guard (NO TEXT = NO GROK)
    async function processInput(text) {
      if (!text || text.trim().length < 1) return;
      
      const uMsg = document.createElement('div');
      uMsg.className = 'msg user';
      uMsg.innerHTML = `<span class="msg-label">YOU</span><span class="msg-text">${text}</span>`;
      scroll.insertBefore(uMsg, typing);
      typing.classList.add('active');

      try {
        const res = await fetch(DEV.N8N_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text })
        });
        
        const raw = await res.text();
        
        // CRITICAL FIX: Block Grok if response looks like an error or system dump
        if (!raw || raw.includes("headers") || raw.includes("Internal Server Error")) {
            addAiMsg("[System Logic Error]");
            return; // EXIT - DO NOT CALL GROK
        }

        addAiMsg(raw);
        await playFred(raw); // Only fires if text is valid

      } catch (err) {
        addAiMsg(`[Connection Error]`);
      } finally {
        typing.classList.remove('active');
      }
    }

    function addAiMsg(text) {
      const m = document.createElement('div');
      m.className = 'msg ai';
      m.innerHTML = `<span class="msg-label">FRED AI</span><span class="msg-text">${text}</span>`;
      scroll.insertBefore(m, typing);
      scroll.scrollTop = scroll.scrollHeight;
    }

    // 3. Parallel TTS
    async function playFred(text) {
      try {
        const res = await fetch(DEV.GROK_URL, {
          method: "POST",
          headers: { "Authorization": `Bearer ${DEV.GROK_KEY}`, "Content-Type": "application/json" },
          body: JSON.stringify({ text: `<soft><fast>${text}</fast></soft>`, voice_id: DEV.VOICE_ID, language: "en" }),
        });
        const blob = await res.blob();
        currentAudio = new Audio(URL.createObjectURL(blob));
        await currentAudio.play();
      } catch (e) { console.error("Grok failed"); }
    }

    // 4. Toggle Logic
    micBtn.onclick = () => {
      if (!isListening) {
        rec.start();
      } else {
        isListening = false;
        rec.stop();
        document.body.className = '';
        statusTxt.textContent = 'MIC OFF';
      }
    };
  </script>
</body>
</html>
