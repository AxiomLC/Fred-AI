<!doctype html>
<!-- Fred AI · W57th — Static index file for Fred AI Web App (voice + chat + media viewer) -->
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Fred AI · W57th</title>
        <link rel="icon" href="/logo.png" />
        <link
            href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Serif+Display:ital@0;1&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="/style.css" />
    </head>

    <body>
        <div id="bg"></div>

        <!-- ═══ APP ═══ -->
        <div id="app">
            <!-- LOGO -->
            <div id="logo-wrap">
                <img src="/logo.png" alt="W57th logo" />
                <div id="brand-line">
                    <span id="brand-fred">Fred AI</span>
                    <span id="brand-w57">· W57TH</span>
                </div>
                <div id="tagline">Voice Intelligence · New York</div>
            </div>

            <!-- TRANSCRIPT -->
            <div id="transcript-wrap">
                <div id="transcript-header">
                    <span class="dot"></span> LIVE CONVERSATION
                </div>
                <div id="transcript-scroll">
                    <div class="msg ai">
                        <span class="msg-label">FRED AI</span>
                        <span class="msg-text"
                            >Hello. I'm Fred. Tap the mic to speak or use the
                            keyboard.</span
                        >
                    </div>

                    <div id="typing">
                        <span></span><span></span><span></span>
                    </div>
                </div>
            </div>

            <!-- CONTROLS -->
            <div id="controls">
                <div id="text-input-wrap">
                    <input
                        type="text"
                        id="text-input-field"
                        placeholder="Type a message..."
                        autocomplete="off"
                        spellcheck="false"
                    />
                </div>
                <button id="mic-btn" aria-label="Tap to speak">
                    <svg
                        id="icon-mic"
                        width="30"
                        height="30"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    >
                        <path
                            d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"
                        />
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
                        <line x1="12" y1="19" x2="12" y2="23" />
                        <line x1="8" y1="23" x2="16" y2="23" />
                    </svg>
                    <svg
                        id="icon-speaker"
                        width="30"
                        height="30"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="#c9a84c"
                        stroke-width="2"
                        style="display: none"
                    >
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14" />
                        <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
                    </svg>
                </button>
                <div id="status-row">
                    <span id="status-text">TAP TO SPEAK</span>
                    <span id="keyboard-toggle">⌨️</span>
                </div>
            </div>
        </div>

        <script>
            /* ════ VERSION ════
     v1.10.0 · 2026-08-17 — Secrets moved server-side. Grok key and n8n
     webhook key are now injected by Cloudflare Pages Functions (/api/tts,
     /api/chat); no API keys remain in client code. Prior versions: see
     git history. */

            const APP_VERSION = "1.10.0";
            const APP_DATE = "2026-08-17";

            /* ════ 1. CONFIG ════ */
            const CFG = {
                N8N_URL: "/api/chat",
                GROK_URL: "/api/tts",
                VOICE_ID: "Rex",
                AUDIO_CODEC: "mp3",
                AUDIO_SAMPLE_RATE: 24000,
                AUDIO_BIT_RATE: 128000,
                LANGUAGE: "en",
                STT_LANG: "en-US",
            };

            const GROK_WRAP = (t) => `<lower-pitch>${t}</lower-pitch>`;

            const STRIP_INLINE =
                /\[(pause|long-pause|hum-tune|laugh|chuckle|giggle|cry|tsk|tongue-click|lip-smack|breath|inhale|exhale|sigh)\]/gi;
            const STRIP_WRAP =
                /<\/?(soft|whisper|loud|build-intensity|decrease-intensity|higher-pitch|lower-pitch|slow|fast|sing-song|singing|laugh-speak|emphasis)>/gi;
            const STRIP_HTML = /<[^>]*>/g;

            function cleanForDisplay(r) {
                return r
                    .replace(STRIP_INLINE, "")
                    .replace(STRIP_WRAP, "")
                    .replace(STRIP_HTML, "")
                    .trim();
            }

            /* Strip URLs from text before sending to Grok TTS — never read URLs aloud */
            function stripUrls(text) {
                return text
                    .replace(/https?:\/\/[^\s,)]+/g, "")
                    .replace(/\s{2,}/g, " ")
                    .trim();
            }

            /* ════ 2. SESSION ════ */
            let savedSess = localStorage.getItem("w57_session");
            if (!savedSess) {
                savedSess = [...crypto.getRandomValues(new Uint8Array(16))]
                    .map((b) => b.toString(16).padStart(2, "0"))
                    .join("");
                localStorage.setItem("w57_session", savedSess);
            }
            const SESSION_ID = savedSess;
            /* ════ 3. DOM REFS ════ */
            const micBtn = document.getElementById("mic-btn"),
                statusTxt = document.getElementById("status-text"),
                scroll = document.getElementById("transcript-scroll"),
                typing = document.getElementById("typing"),
                iconMic = document.getElementById("icon-mic"),
                iconSpk = document.getElementById("icon-speaker"),
                kbdToggle = document.getElementById("keyboard-toggle"),
                kbdWrap = document.getElementById("text-input-wrap"),
                kbdInput = document.getElementById("text-input-field");

            let isListening = false,
                isSpeaking = false,
                currentAudio = null,
                _micCooldown = false,
                _ttsGen = 0; /* incremented on every new response; stale playFred calls self-abort */

            /* ════ 4. STATE ════ */
            function setState(s) {
                document.body.className = s;
                isSpeaking = s === "speaking";
                if (s === "listening") {
                    statusTxt.textContent = "LISTENING...";
                    iconMic.style.display = "block";
                    iconSpk.style.display = "none";
                } else if (s === "speaking") {
                    statusTxt.textContent = "FRED IS SPEAKING";
                    iconMic.style.display = "none";
                    iconSpk.style.display = "block";
                } else if (s === "thinking") {
                    statusTxt.textContent = "FRED IS THINKING...";
                } else {
                    statusTxt.textContent = "TAP TO SPEAK";
                    iconMic.style.display = "block";
                    iconSpk.style.display = "none";
                }
            }

            /* ════ 5. TRANSCRIPT ════ */
            /* Converts plain URLs in text into clickable <a> links */
            function linkify(text) {
                const URL_RE = /(https?:\/\/[^\s<>"']+)/g;
                const frag = document.createDocumentFragment();
                let last = 0,
                    m;
                URL_RE.lastIndex = 0;
                while ((m = URL_RE.exec(text)) !== null) {
                    if (m.index > last) {
                        frag.appendChild(
                            document.createTextNode(text.slice(last, m.index)),
                        );
                    }
                    const a = document.createElement("a");
                    a.href = m[1];
                    a.target = "_blank";
                    a.rel = "noopener noreferrer";
                    a.className = "msg-link";
                    /* Shorten display: show domain + truncated path */
                    try {
                        const u = new URL(m[1]);
                        a.textContent =
                            u.hostname +
                            (u.pathname.length > 1
                                ? u.pathname.slice(0, 28) +
                                  (u.pathname.length > 28 ? "…" : "")
                                : "");
                    } catch {
                        a.textContent = m[1];
                    }
                    frag.appendChild(a);
                    last = m.index + m[0].length;
                }
                if (last < text.length)
                    frag.appendChild(document.createTextNode(text.slice(last)));
                return frag;
            }

            function addMsg(role, text) {
                typing.classList.remove("active");
                const m = document.createElement("div");
                m.className = `msg ${role}`;

                const label = document.createElement("span");
                label.className = "msg-label";
                label.textContent = role === "user" ? "YOU" : "FRED AI";

                const body = document.createElement("span");
                body.className = "msg-text";
                body.appendChild(linkify(text));

                m.appendChild(label);
                m.appendChild(body);
                /* insert before typing indicator */
                scroll.insertBefore(m, typing);
                scroll.scrollTop = scroll.scrollHeight;
            }

            /* ════ 6. MEDIA DISPLAY ════ */
            const MEDIA_PREFIX = "Media query results received:";

            function parseMediaUrls(text) {
                if (!text.toLowerCase().startsWith(MEDIA_PREFIX.toLowerCase()))
                    return null;
                /* Stop at comma or newline — handles spaces in filenames */
                const urlRegex = /(\d+)\.\s*(https?:\/\/[^,\n]+)/gi;
                const matches = [...text.matchAll(urlRegex)];
                if (!matches.length) return null;
                const seen = new Set(),
                    urls = [];
                for (const m of matches) {
                    const num = parseInt(m[1], 10);
                    const url = m[2].replace(/['",).\s]+$/, "").trim();
                    if (!url || seen.has(url)) continue;
                    seen.add(url);
                    const ext = url.split("?")[0].toLowerCase();
                    let mimeType = "image";
                    if (ext.match(/\.(mp4|mov|avi|mkv|webm)$/))
                        mimeType = "video";
                    else if (ext.match(/\.pdf$/)) mimeType = "pdf";
                    urls.push({ num, url, mimeType });
                }
                return urls.length ? urls : null;
            }

            function displayMedia(urls) {
                /* Create a fresh media block each time — treated as a timeline event
                   so it scrolls naturally with the conversation */
                const block = document.createElement("div");
                block.className = "media-block";

                const track = document.createElement("div");
                track.className = "media-viewer-track";

                for (const item of urls) {
                    const el = document.createElement("div");
                    el.className = "media-thumb";

                    /* Number badge */
                    const badge = document.createElement("span");
                    badge.className = "media-num";
                    badge.textContent = item.num;
                    el.appendChild(badge);

                    /* Normalise CDN url: pre-encode # before URL parsing (else
                       browser treats it as a fragment and drops it from the
                       path), then re-encode path segments for spaces/unicode */
                    const safeUrl = (() => {
                        try {
                            const preEncoded = item.url.replace(/#/g, "%23");
                            const u = new URL(preEncoded);
                            u.pathname = u.pathname
                                .split("/")
                                .map(s => encodeURIComponent(decodeURIComponent(s)))
                                .join("/");
                            return u.toString();
                        } catch { return item.url.replace(/#/g, "%23"); }
                    })();
                    if (item.mimeType === "image") {
                        const img = document.createElement("img");
                        img.src = safeUrl;
                        img.loading = "lazy";
                        img.onclick = () =>
                            window.open(safeUrl, "_blank", "noopener");
                        el.appendChild(img);
                    } else if (item.mimeType === "video") {
                        const vid = document.createElement("video");
                        vid.src = safeUrl;
                        vid.preload = "auto";
                        vid.setAttribute("playsinline", "");
                        vid.controls = true;
                        vid.disablePictureInPicture = true;
                        el.appendChild(vid);
                    } else if (item.mimeType === "pdf") {
                        const a = document.createElement("a");
                        a.href = safeUrl;
                        a.target = "_blank";
                        a.rel = "noopener noreferrer";
                        a.className = "media-pdf";
                        a.textContent = "📄 PDF";
                        el.appendChild(a);
                    }
                    track.appendChild(el);
                }

                block.appendChild(track);
                /* Insert before typing indicator so it sits in timeline order */
                scroll.insertBefore(block, typing);
                scroll.scrollTop = scroll.scrollHeight;
            }

            function stripMediaPrefix() {
                return "Media results received.";
            }

            /* ════ 7. SPEECH RECOGNITION ════ */
            const SpeechRec =
                window.SpeechRecognition || window.webkitSpeechRecognition;
            let rec = null;
            if (SpeechRec) {
                rec = new SpeechRec();
                rec.lang = CFG.STT_LANG;
                rec.onstart = () => {
                    isListening = true;
                    setState("listening");
                };
                rec.onresult = (e) => processInput(e.results[0][0].transcript);
                rec.onend = () => {
                    isListening = false;
                    if (!isSpeaking) setState("");
                };
                rec.onerror = (e) => {
                    isListening = false;
                    if (e.error !== "aborted")
                        addMsg("ai", `[Mic Error: ${e.error}]`);
                    setState("");
                };
            }

            /* ════ 8. MAIN FLOW ════ */
            async function processInput(text) {
                _ttsGen++;                          /* invalidate any in-flight playFred */
                if (currentAudio) {
                    currentAudio.pause();
                    URL.revokeObjectURL(currentAudio.src);
                    currentAudio = null;
                }
                addMsg("user", text);
                setState("thinking");
                typing.classList.add("active");

                try {
                    const res = await fetch(CFG.N8N_URL, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            text,
                            sessionId: SESSION_ID,
                        }),
                    });

                    if (!res.ok) throw new Error(`HTTP ${res.status}`);

                    const rawText = await res.text();
                    let raw = rawText;
                    try {
                        const parsed = JSON.parse(rawText);
                        if (Array.isArray(parsed) && parsed[0]?.output)
                            raw = parsed[0].output;
                        else if (parsed?.output) raw = parsed.output;
                    } catch { /* not JSON, use raw text as-is */ }
                    const mediaUrls = parseMediaUrls(raw);
                    const ttsText = mediaUrls
                        ? stripMediaPrefix()
                        : stripUrls(raw);
                    const display = cleanForDisplay(
                        mediaUrls ? stripMediaPrefix() : raw,
                    );

                    addMsg("ai", display);
                    if (mediaUrls) displayMedia(mediaUrls);
                    await playFred(ttsText, display);
                } catch (err) {
                    typing.classList.remove("active");
                    addMsg("ai", "⚠ Connection issue. Check n8n webhook.");
                    if (kbdWrap.style.display === "none") {
                        kbdWrap.style.display = "flex";
                        kbdInput.focus();
                    }
                    setState("");
                }
            }

            /* ════ 9. TTS ════ */
            async function playFred(tagged, fallback) {
                const myGen = _ttsGen;             /* capture generation at call time */
                setState("speaking");
                let blobUrl = null;
                try {
                    const res = await fetch(CFG.GROK_URL, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                        },
                        body: JSON.stringify({
                            text: GROK_WRAP(tagged),
                            voice_id: CFG.VOICE_ID,
                            language: CFG.LANGUAGE,
                            output_format: {
                                codec: CFG.AUDIO_CODEC,
                                sample_rate: CFG.AUDIO_SAMPLE_RATE,
                                bit_rate: CFG.AUDIO_BIT_RATE,
                            },
                        }),
                    });

                    const blob = await res.blob();

                    /* If a newer response arrived while we were fetching, discard this audio */
                    if (myGen !== _ttsGen) { URL.createObjectURL(blob); return; }

                    blobUrl = URL.createObjectURL(blob);
                    currentAudio = new Audio(blobUrl);

                    currentAudio.onended = () => {
                        URL.revokeObjectURL(blobUrl);
                        currentAudio = null;
                        setState("");
                    };
                    currentAudio.onerror = () => {
                        URL.revokeObjectURL(blobUrl);
                        currentAudio = null;
                        fallbackTTS(fallback);
                    };

                    await currentAudio.play();
                } catch {
                    if (blobUrl) URL.revokeObjectURL(blobUrl);
                    if (myGen === _ttsGen) fallbackTTS(fallback);
                }
            }

            function fallbackTTS(text) {
                const ut = new SpeechSynthesisUtterance(text);
                ut.onend = () => setState("");
                speechSynthesis.speak(ut);
            }

            /* ════ 10. UI EVENTS ════ */
            micBtn.onclick = () => {
                if (!rec) {
                    addMsg(
                        "ai",
                        "Mic not supported in this browser. Use the keyboard.",
                    );
                    kbdWrap.style.display = "flex";
                    kbdInput.focus();
                    return;
                }
                if (_micCooldown) return;
                _micCooldown = true;
                setTimeout(() => {
                    _micCooldown = false;
                }, 300);

                if (isListening) {
                    rec.stop();
                } else {
                    if (isSpeaking && currentAudio) {
                        currentAudio.pause();
                        currentAudio = null;
                    }
                    rec.start();
                }
            };

            kbdToggle.onclick = () => {
                const show = kbdWrap.style.display !== "flex";
                kbdWrap.style.display = show ? "flex" : "none";
                if (show) kbdInput.focus();
            };

            kbdInput.onkeydown = (e) => {
                if (e.key === "Enter" && kbdInput.value.trim()) {
                    const msg = kbdInput.value.trim();
                    kbdInput.value = "";
                    kbdWrap.style.display = "none";
                    processInput(msg);
                }
            };
        </script>
    </body>
</html>
