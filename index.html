<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fred AI · Voice Intelligence</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="bg"></div>
  <div id="bg-vignette"></div>
  <div id="app">
    <div id="logo-wrap">
      <img src="https://media.airpg.ai/icon2-circle.png" alt="W57th" />
      <div id="brand-line">
        <span id="brand-w57">W57TH</span> <span id="brand-fred">Fred AI</span>
      </div>
      <div id="tagline">Voice Intelligence · New York</div>
    </div>

    <div id="transcript-wrap">
      <div id="transcript-header"><span class="dot"></span> LIVE CONVERSATION</div>
      <div id="transcript-scroll">
        <div id="typing"><span></span><span></span><span></span></div>
      </div>
    </div>

    <div id="controls">
      <div id="text-input-wrap" style="display:none;">
        <input type="text" id="text-input-field" placeholder="Type a message..." autocomplete="off" />
      </div>
      <div id="waveform"></div>
      <button id="mic-btn">
        <svg id="icon-mic" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#a78bfa" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
      </button>
      <div id="status-row">
        <span id="status-text">TAP TO START</span>
        <span id="keyboard-toggle" style="cursor:pointer; margin-left:10px;">⌨️</span>
      </div>
    </div>
    <div id="footer">W57TH · FRED AI · POWERED BY AIRPG.AI</div>
  </div>

  <script>
    const DEV = {
      N8N_URL: "https://n8n.airpg.ai/webhook/fred",
      GROK_URL: "https://api.x.ai/v1/tts",
      GROK_KEY: "xai-5aDdDimj7pOBE6TxvGng1W4REEOlezq6ZHhHVdy9lunH7uWKsjIzA9mQimctnv9d1ItfI2j3YPCEh4cB",
      VOICE_ID: "96819d0bd28d"
    };

    const micBtn = document.getElementById('mic-btn'),
          statusTxt = document.getElementById('status-text'),
          scroll = document.getElementById('transcript-scroll'),
          typing = document.getElementById('typing'),
          kbdToggle = document.getElementById('keyboard-toggle'),
          kbdWrap = document.getElementById('text-input-wrap'),
          kbdInput = document.getElementById('text-input-field');

    let isListening = false, currentAudio = null;

    /* ── 1. HARD TOGGLE MIC (Manual Only) ── */
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    const rec = new SpeechRec();
    rec.continuous = true; 
    rec.interimResults = false;

    rec.onstart = () => { 
      isListening = true; 
      document.body.classList.add('listening'); 
      statusTxt.textContent = 'MIC LIVE'; 
    };
    
    rec.onend = () => { 
      if(isListening) rec.start(); // Auto-restart if browser drops it, until user hits stop
    };

    rec.onresult = (e) => {
      const text = e.results[e.results.length - 1][0].transcript;
      if (text.trim().length > 0) processInput(text);
    };

    /* ── 2. LOGIC GUARD: NO TEXT = NO GROK ── */
    async function processInput(text) {
      if (currentAudio) currentAudio.pause();
      addMsg('user', text);
      typing.classList.add('active');

      try {
        const res = await fetch(DEV.N8N_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text })
        });

        const raw = await res.text();

        // SHIELD: If n8n sends headers, JSON, or an error, kill the flow here.
        const isGarbage = raw.includes("headers") || raw.includes("{") || raw.includes("Internal Server Error") || !raw.trim();
        
        if (isGarbage) {
          addMsg('ai', `[System Halt: Invalid Response from n8n]`, true);
          return; // STOP: Do not update scroll box with clean text, do not call Grok.
        }

        const clean = raw.replace(/<[^>]*>/g, "").replace(/\[.*?\]/g, "");
        addMsg('ai', clean);
        
        // Parallel call to Grok only with verified text
        playFred(raw);

      } catch (err) {
        addMsg('ai', `[System Halt: Connection Failed]`, true);
      } finally {
        typing.classList.remove('active');
      }
    }

    function addMsg(role, text, isError = false) {
      const m = document.createElement('div');
      m.className = `msg ${role} ${isError ? 'system-error' : ''}`;
      m.innerHTML = `<span class="msg-label">${role==='user'?'YOU':'FRED AI'}</span><span class="msg-text">${text}</span>`;
      scroll.insertBefore(m, typing);
      scroll.scrollTop = scroll.scrollHeight;
    }

    /* ── 3. GROK VOICE CALL (PARALLEL) ── */
    async function playFred(text) {
      try {
        const res = await fetch(DEV.GROK_URL, {
          method: "POST",
          headers: { "Authorization": `Bearer ${DEV.GROK_KEY}`, "Content-Type": "application/json" },
          body: JSON.stringify({ 
            text: `<soft><fast>${text}</fast></soft>`, 
            voice_id: DEV.VOICE_ID, 
            language: "en" 
          }),
        });
        if(!res.ok) return;
        const blob = await res.blob();
        currentAudio = new Audio(URL.createObjectURL(blob));
        await currentAudio.play();
      } catch (e) { console.error("Grok Blocked."); }
    }

    /* ── 4. UI TOGGLES ── */
    micBtn.onclick = () => {
      if (!isListening) {
        rec.start();
      } else {
        isListening = false;
        rec.stop();
        document.body.classList.remove('listening');
        statusTxt.textContent = 'MIC OFF';
      }
    };

    kbdToggle.onclick = () => {
      kbdWrap.style.display = kbdWrap.style.display === 'flex' ? 'none' : 'flex';
      if(kbdWrap.style.display === 'flex') kbdInput.focus();
    };

    kbdInput.onkeydown = (e) => {
      if (e.key === 'Enter' && kbdInput.value.trim()) {
        processInput(kbdInput.value);
        kbdInput.value = '';
        kbdWrap.style.display = 'none';
      }
    };
  </script>
</body>
</html>
