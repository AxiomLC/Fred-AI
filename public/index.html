<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Fred AI · W57th</title>
        <link
            rel="icon"
            href="https://fred-ai.davesartori.workers.dev/logo.png"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap"
            rel="stylesheet"
        />
        <link
            rel="stylesheet"
            href="https://fred-ai.davesartori.workers.dev/style.css"
        />
    </head>

    <body>
        <div id="bg"></div>
        <div id="bg-vignette"></div>

        <!-- ═══ APP ═══ -->
        <div id="app">
            <!-- LOGO -->
            <div id="logo-wrap">
                <img
                    src="https://fred-ai.davesartori.workers.dev/logo.png"
                    alt="W57th logo"
                />
                <div id="brand-line">
                    <span id="brand-fred">Fred AI</span>
                    <span id="brand-w57">· W57TH</span>
                </div>
                <div id="tagline">Voice Intelligence · New York</div>
            </div>

            <!-- TRANSCRIPT -->
            <div id="transcript-wrap">
                <div id="transcript-header">
                    <span class="dot"></span> LIVE CONVERSATION
                </div>
                <div id="transcript-scroll">
                    <div class="msg ai">
                        <span class="msg-label">FRED AI</span>
                        <span class="msg-text"
                            >Hello. I'm Fred. Tap the mic to speak or use the
                            keyboard.</span
                        >
                    </div>
                    <div id="typing">
                        <span></span><span></span><span></span>
                    </div>
                </div>
            </div>

            <!-- CONTROLS -->
            <div id="controls">
                <div id="text-input-wrap">
                    <input
                        type="text"
                        id="text-input-field"
                        placeholder="Type a message..."
                        autocomplete="off"
                    />
                </div>
                <div id="waveform"></div>
                <button id="mic-btn" aria-label="Tap to speak">
                    <svg
                        id="icon-mic"
                        width="30"
                        height="30"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    >
                        <path
                            d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"
                        />
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
                        <line x1="12" y1="19" x2="12" y2="23" />
                        <line x1="8" y1="23" x2="16" y2="23" />
                    </svg>
                    <svg
                        id="icon-speaker"
                        width="30"
                        height="30"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="#a78bfa"
                        stroke-width="2"
                        style="display: none"
                    >
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14" />
                        <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
                    </svg>
                </button>
                <div id="status-row">
                    <span id="status-text">TAP TO SPEAK</span>
                    <span id="keyboard-toggle">⌨️</span>
                </div>
            </div>
            <div id="footer">W57TH · FRED AI · POWERED BY AIRPG.AI</div>
        </div>

        <!-- ═══ MEDIA VIEWER ═══ -->
        <div id="media-viewer">
            <div id="media-viewer-header">
                <span class="dot"></span> MEDIA RESULTS
            </div>
            <div id="media-viewer-track"></div>
        </div>

        <script>
            /* ═══════════════════════════════════════
     1. CONFIG
     ═══════════════════════════════════════ */
            const APP_VERSION = "1.2.0";
            const APP_DATE = "2026-06-05";

            const DEV = {
                N8N_URL: "https://n8n.airpg.ai/webhook/fred",
                GROK_URL: "https://api.x.ai/v1/tts",
                GROK_KEY:
                    "xai-5aDdDimj7pOBE6TxvGng1W4REEOlezq6ZHhHVdy9lunH7uWKsjIzA9mQimctnv9d1ItfI2j3YPCEh4cB",
                VOICE_ID: "Rex",
                AUDIO_CODEC: "mp3",
                AUDIO_SAMPLE_RATE: 24000,
                AUDIO_BIT_RATE: 128000,
                LANGUAGE: "en",
                STT_LANG: "en-US",
            };

            const GROK_WRAP = (t) => `<lower-pitch>${t}</lower-pitch>`;

            const STRIP_INLINE =
                /\[(pause|long-pause|hum-tune|laugh|chuckle|giggle|cry|tsk|tongue-click|lip-smack|breath|inhale|exhale|sigh)\]/gi;
            const STRIP_WRAP =
                /<\/?(soft|whisper|loud|build-intensity|decrease-intensity|higher-pitch|lower-pitch|slow|fast|sing-song|singing|laugh-speak|emphasis)>/gi;
            const STRIP_HTML = /<[^>]*>/g;

            function cleanForDisplay(r) {
                return r
                    .replace(STRIP_INLINE, "")
                    .replace(STRIP_WRAP, "")
                    .replace(STRIP_HTML, "")
                    .trim();
            }

            /* ═══════════════════════════════════════
     2. SESSION
     ═══════════════════════════════════════ */
            const _urlPhone = new URLSearchParams(location.search).get("phone");
            if (_urlPhone) localStorage.setItem("w57_phone", _urlPhone);
            const USER_PHONE = localStorage.getItem("w57_phone") || null;

            let savedSess = localStorage.getItem("w57_session");
            if (!savedSess) {
                savedSess = "sess_" + Math.random().toString(36).slice(2, 9);
                localStorage.setItem("w57_session", savedSess);
            }
            const SESSION_ID = savedSess;

            /* ═══════════════════════════════════════
     3. DOM REFS
     ═══════════════════════════════════════ */
            const micBtn = document.getElementById("mic-btn"),
                statusTxt = document.getElementById("status-text"),
                scroll = document.getElementById("transcript-scroll"),
                typing = document.getElementById("typing"),
                iconMic = document.getElementById("icon-mic"),
                iconSpk = document.getElementById("icon-speaker"),
                kbdToggle = document.getElementById("keyboard-toggle"),
                kbdWrap = document.getElementById("text-input-wrap"),
                kbdInput = document.getElementById("text-input-field"),
                waveform = document.getElementById("waveform");

            let isListening = false,
                isSpeaking = false,
                currentAudio = null;

            /* ═══════════════════════════════════════
     4. WAVEFORM
     ═══════════════════════════════════════ */
            for (let i = 0; i < 28; i++) {
                const b = document.createElement("div");
                b.className = "bar";
                b.style.animationDelay = `${((i / 28) * 0.6).toFixed(2)}s`;
                waveform.appendChild(b);
            }

            /* ═══════════════════════════════════════
     5. STATE
     ═══════════════════════════════════════ */
            function setState(s) {
                document.body.className = s;
                isSpeaking = s === "speaking";
                if (s === "listening") {
                    statusTxt.textContent = "LISTENING...";
                    iconMic.style.display = "block";
                    iconSpk.style.display = "none";
                } else if (s === "speaking") {
                    statusTxt.textContent = "FRED IS SPEAKING";
                    iconMic.style.display = "none";
                    iconSpk.style.display = "block";
                } else if (s === "thinking") {
                    statusTxt.textContent = "FRED IS THINKING...";
                } else {
                    statusTxt.textContent = "TAP TO SPEAK";
                    iconMic.style.display = "block";
                    iconSpk.style.display = "none";
                }
            }

            /* ═══════════════════════════════════════
     6. TRANSCRIPT
     ═══════════════════════════════════════ */
            function addMsg(role, text) {
                typing.classList.remove("active");
                const m = document.createElement("div");
                m.className = `msg ${role}`;
                m.innerHTML = `<span class="msg-label">${role === "user" ? "YOU" : "FRED AI"}</span><span class="msg-text">${text}</span>`;
                scroll.insertBefore(m, typing);
                scroll.scrollTop = scroll.scrollHeight;
            }

            /* ═══════════════════════════════════════
     7. MEDIA DISPLAY
     ═══════════════════════════════════════ */
            const MEDIA_PREFIX = "Media Query Results received:";
            const mediaViewer = document.getElementById("media-viewer");
            const mediaTrack = document.getElementById("media-viewer-track");

            function parseMediaUrls(text) {
                if (!text.startsWith(MEDIA_PREFIX)) return null;
                const urlRegex = /\d+\.\s*(https?:\/\/[^\s,]+)/gi;
                const matches = [...text.matchAll(urlRegex)];
                if (!matches.length) return null;
                const seen = new Set(),
                    urls = [];
                for (const m of matches) {
                    const url = m[1].replace(/['",]+$/, "").trim();
                    if (!url || seen.has(url)) continue;
                    seen.add(url);
                    const ext = url.split("?")[0].toLowerCase();
                    let t = "image";
                    if (ext.match(/\.(mp4|mov|avi|mkv|webm)$/)) t = "video";
                    else if (ext.match(/\.pdf$/)) t = "pdf";
                    urls.push({ url, mimeType: t });
                }
                return urls.length ? urls : null;
            }

            function displayMedia(urls) {
                mediaTrack.innerHTML = "";
                for (const item of urls) {
                    const el = document.createElement("div");
                    el.className = "media-thumb";
                    if (item.mimeType === "image")
                        el.innerHTML = `<img src="${item.url}" loading="lazy" onclick="window.open('${item.url}')" />`;
                    else if (item.mimeType === "video")
                        el.innerHTML = `<video src="${item.url}" preload="metadata" onclick="this.paused?this.play():this.pause()"></video>`;
                    else if (item.mimeType === "pdf")
                        el.innerHTML = `<a href="${item.url}" target="_blank" class="media-pdf">📄 PDF</a>`;
                    mediaTrack.appendChild(el);
                }
                mediaViewer.style.display = "block";
            }

            function stripMediaPrefix(raw) {
                if (!raw.startsWith(MEDIA_PREFIX)) return raw;
                return (
                    raw
                        .replace(
                            /^Media Query Results received:[^.]*\.\s*/i,
                            "",
                        )
                        .trim() || "Results received."
                );
            }

            /* ═══════════════════════════════════════
     8. SPEECH RECOGNITION
     ═══════════════════════════════════════ */
            const SpeechRec =
                window.SpeechRecognition || window.webkitSpeechRecognition;
            let rec = null;
            if (SpeechRec) {
                rec = new SpeechRec();
                rec.lang = DEV.STT_LANG;
                rec.onstart = () => {
                    isListening = true;
                    setState("listening");
                };
                rec.onresult = (e) => processInput(e.results[0][0].transcript);
                rec.onend = () => {
                    isListening = false;
                    if (!isSpeaking) setState("");
                };
                rec.onerror = (e) => {
                    if (e.error !== "aborted")
                        addMsg("ai", `[Mic Error: ${e.error}]`);
                    setState("");
                };
            }

            /* ═══════════════════════════════════════
     9. MAIN FLOW
     ═══════════════════════════════════════ */
            async function processInput(text) {
                if (currentAudio) currentAudio.pause();
                addMsg("user", text);
                setState("thinking");
                typing.classList.add("active");

                try {
                    const res = await fetch(DEV.N8N_URL, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            text,
                            sessionId: SESSION_ID,
                            phone: USER_PHONE,
                        }),
                    });
                    const raw = await res.text();
                    const mediaUrls = parseMediaUrls(raw);
                    const ttsText = mediaUrls ? stripMediaPrefix(raw) : raw;
                    const display = cleanForDisplay(ttsText);
                    if (mediaUrls) displayMedia(mediaUrls);
                    addMsg("ai", display);
                    playFred(ttsText, display);
                } catch (err) {
                    addMsg("ai", "⚠ Connection issue. Check CORS on n8n.");
                    setState("");
                }
            }

            /* ═══════════════════════════════════════
     10. TTS
     ═══════════════════════════════════════ */
            async function playFred(tagged, fallback) {
                setState("speaking");
                try {
                    const res = await fetch(DEV.GROK_URL, {
                        method: "POST",
                        headers: {
                            Authorization: `Bearer ${DEV.GROK_KEY}`,
                            "Content-Type": "application/json",
                        },
                        body: JSON.stringify({
                            text: GROK_WRAP(tagged),
                            voice_id: DEV.VOICE_ID,
                            language: DEV.LANGUAGE,
                            output_format: {
                                codec: DEV.AUDIO_CODEC,
                                sample_rate: DEV.AUDIO_SAMPLE_RATE,
                                bit_rate: DEV.AUDIO_BIT_RATE,
                            },
                        }),
                    });
                    const blob = await res.blob();
                    currentAudio = new Audio(URL.createObjectURL(blob));
                    await currentAudio.play();
                    currentAudio.onended = () => setState("");
                } catch (e) {
                    const ut = new SpeechSynthesisUtterance(fallback);
                    ut.onend = () => setState("");
                    speechSynthesis.speak(ut);
                }
            }

            /* ═══════════════════════════════════════
     11. UI EVENTS
     ═══════════════════════════════════════ */
            micBtn.onclick = () => {
                if (isListening) rec.stop();
                else {
                    if (isSpeaking && currentAudio) currentAudio.pause();
                    rec.start();
                }
            };

            kbdToggle.onclick = () => {
                const show = kbdWrap.style.display !== "flex";
                kbdWrap.style.display = show ? "flex" : "none";
                if (show) kbdInput.focus();
            };

            kbdInput.onkeydown = (e) => {
                if (e.key === "Enter" && kbdInput.value.trim()) {
                    processInput(kbdInput.value);
                    kbdInput.value = "";
                    kbdWrap.style.display = "none";
                }
            };
        </script>
    </body>
</html>
